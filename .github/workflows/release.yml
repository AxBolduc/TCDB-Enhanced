name: Release userscript

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Calculate next semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            current_version="$(node -p "require('./package.json').version")"
            commit_range=""
          else
            current_version="${latest_tag#v}"
            commit_range="${latest_tag}..HEAD"
          fi

          messages="$(git log --format=%B $commit_range)"
          if grep -qiE '(^|[[:space:]])BREAKING([[:space:]:!]|$)|BREAKING CHANGE' <<< "$messages"; then
            bump="major"
          elif grep -qiE '^feat(\(.+\))?!?:|(^|[[:space:]])feat:' <<< "$messages"; then
            bump="minor"
          else
            bump="patch"
          fi

          IFS=. read -r major minor patch <<< "$current_version"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next_version="${major}.${minor}.${patch}"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Apply version for build
        run: pnpm exec npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Test
        run: pnpm test -- --run

      - name: Build userscript
        run: pnpm build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.user.js
